# Publication automatique de l'application iPhone sur GitHub Pages à chaque push sur main.
# Le dépôt ne contient que le code : aucune donnée utilisateur n'est jamais envoyée sur GitHub.
name: Publier l'application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Installation
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests (calculs, règles métier, PDF)
        run: npm test
      - name: Compilation pour GitHub Pages
        run: npm run build -w frontend
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
